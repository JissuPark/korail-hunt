services:
  bot:
    image: ${BOT_IMAGE:-ghcr.io/jissupark/korail-hunt:latest}
    container_name: korail-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      # 승인된 사용자 목록·재시작 스냅샷·세션 핸드오프가 여기 쌓인다.
      # 이 볼륨이 없으면 배포할 때마다 승인 목록이 날아간다.
      #
      # 주의: 바인드 마운트라 호스트 디렉터리의 소유권이 그대로 적용된다.
      # 컨테이너는 uid 1000(Dockerfile 의 APP_UID)으로 도니 이 디렉터리도
      # 같은 uid 소유여야 한다. 아니면 "Permission denied" 로 아무것도
      # 기록되지 않는다 — 로그에 WARNING 만 남고 봇은 계속 돌기 때문에
      # 눈치채기 어렵다. 확인: ls -n data  (첫 숫자가 uid)
      - ./data:/app/data
    # 종료 시 세션 핸드오프를 기록할 시간을 준다. 기본 10초로는 모자랄 수 있다.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
