<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>korail-hunt 기기 정보 감지</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 20px;
    background-color: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
    line-height: 1.5;
  }
  h2 { margin-top: 0; }
  .hint {
    color: var(--tg-theme-hint-color, #707579);
    font-size: 14px;
    margin-bottom: 16px;
  }
  .info {
    background: var(--tg-theme-secondary-bg-color, #f4f4f5);
    padding: 14px;
    border-radius: 10px;
    margin: 12px 0;
    word-break: break-all;
  }
  .info .label {
    font-weight: 600;
    margin-bottom: 4px;
    font-size: 13px;
    color: var(--tg-theme-hint-color, #707579);
  }
  .info .value {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
  }
  button {
    width: 100%;
    padding: 14px;
    background: var(--tg-theme-button-color, #3390ec);
    color: var(--tg-theme-button-text-color, #ffffff);
    border: 0;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 12px;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .warn {
    background: rgba(255, 165, 0, 0.15);
    color: #9a6500;
    padding: 12px;
    border-radius: 8px;
    margin: 12px 0;
    font-size: 14px;
  }
</style>
</head>
<body>
<h2>📱 기기 정보 감지</h2>
<p class="hint">아래 정보를 코레일 호출에 쓸 User-Agent 로 변환해 저장합니다. 매크로 감지 우회에 도움.</p>

<div id="content"></div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  const content = document.getElementById('content');

  if (!tg || !tg.initData) {
    content.innerHTML =
      '<div class="warn">이 페이지는 Telegram 봇 안에서만 사용된다. ' +
      '봇의 /login 후 [기기 정보 감지] 버튼을 통해 열어라.</div>';
    return;
  }

  tg.ready();
  tg.expand();

  const ua = navigator.userAgent || '(unknown)';
  const platform = tg.platform || '(unknown)';

  content.innerHTML = `
    <div class="info">
      <div class="label">Telegram 플랫폼</div>
      <div class="value">${platform}</div>
    </div>
    <div class="info">
      <div class="label">User-Agent</div>
      <div class="value">${ua}</div>
    </div>
    <button id="send">이 정보로 저장</button>
  `;

  document.getElementById('send').addEventListener('click', function () {
    const payload = JSON.stringify({
      type: 'device_info',
      user_agent: ua,
      platform: platform,
    });
    try {
      tg.sendData(payload);
      // sendData 는 자동으로 webview 를 닫는다. fallback 으로도 호출.
      tg.close();
    } catch (e) {
      alert('전송 실패: ' + e.message);
    }
  });
})();
</script>
</body>
</html>
