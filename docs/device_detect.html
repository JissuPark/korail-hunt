<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>korail-hunt 기기 정보 감지</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 20px;
    background-color: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
    line-height: 1.5;
  }
  h2 { margin-top: 0; }
  .hint {
    color: var(--tg-theme-hint-color, #707579);
    font-size: 14px;
    margin-bottom: 16px;
  }
  .info {
    background: var(--tg-theme-secondary-bg-color, #f4f4f5);
    padding: 14px;
    border-radius: 10px;
    margin: 12px 0;
    word-break: break-all;
  }
  .info .label {
    font-weight: 600;
    margin-bottom: 4px;
    font-size: 13px;
    color: var(--tg-theme-hint-color, #707579);
  }
  .info .value {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
  }
  button {
    width: 100%;
    padding: 14px;
    background: var(--tg-theme-button-color, #3390ec);
    color: var(--tg-theme-button-text-color, #ffffff);
    border: 0;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 12px;
  }
  button.secondary {
    background: var(--tg-theme-secondary-bg-color, #f4f4f5);
    color: var(--tg-theme-text-color, #000000);
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .warn {
    background: rgba(255, 165, 0, 0.15);
    color: #9a6500;
    padding: 12px; border-radius: 8px; margin: 12px 0; font-size: 14px;
  }
  .err {
    background: rgba(220, 50, 50, 0.15);
    color: #b00020;
    padding: 12px; border-radius: 8px; margin: 12px 0; font-size: 14px;
  }
  .ok {
    background: rgba(40, 180, 60, 0.15);
    color: #1a7e34;
    padding: 12px; border-radius: 8px; margin: 12px 0; font-size: 14px;
  }
</style>
</head>
<body>
<h2>📱 기기 정보 감지</h2>
<p class="hint">아래 정보를 코레일 호출에 쓸 User-Agent 로 변환해 저장합니다. 매크로 감지 우회에 도움.</p>

<div class="info">
  <div class="label">Telegram 플랫폼</div>
  <div class="value" id="platform-val">감지 중...</div>
</div>
<div class="info">
  <div class="label">User-Agent</div>
  <div class="value" id="ua-val">감지 중...</div>
</div>
<button id="send">이 정보로 저장</button>
<button id="copy" class="secondary">UA 복사 (수동 fallback)</button>
<div id="result"></div>

<script>
// UA 는 무조건 즉시 채운다 — Telegram 스크립트 로드 여부와 무관.
document.getElementById('ua-val').textContent = navigator.userAgent || '(unknown)';

// Telegram WebApp 객체는 외부 스크립트 로드에 의존한다. 즉시 없을 수도 있으니
// 짧게 polling 한 뒤 platform 값 채우고 ready/expand 호출.
function whenTelegramReady(cb, attempts) {
  attempts = attempts || 0;
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { cb(tg); return; }
  if (attempts >= 20) { cb(null); return; } // 약 1초 대기 (50ms * 20)
  setTimeout(function () { whenTelegramReady(cb, attempts + 1); }, 50);
}

var TG = null;

whenTelegramReady(function (tg) {
  TG = tg;
  if (tg) {
    document.getElementById('platform-val').textContent = tg.platform || '(unknown)';
    try { tg.ready(); tg.expand(); } catch (e) { /* noop */ }
  } else {
    // 브라우저에서 직접 열렸거나 telegram-web-app.js 로드 실패
    document.getElementById('platform-val').textContent = '(non-telegram)';
    var r = document.getElementById('result');
    r.innerHTML = '<div class="warn">Telegram WebApp 컨텍스트가 없다. ' +
      '봇 채팅으로 가서 /setdevice 후 [기기 정보 자동 감지] 버튼으로 다시 열어라. ' +
      '저장은 작동하지 않을 가능성이 크지만 [UA 복사] 는 사용 가능.</div>';
  }
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

function payload() {
  return JSON.stringify({
    type: 'device_info',
    user_agent: navigator.userAgent || '',
    platform: (TG && TG.platform) || 'browser',
  });
}

document.getElementById('send').addEventListener('click', function () {
  var result = document.getElementById('result');
  if (!TG) {
    result.innerHTML = '<div class="err">Telegram 컨텍스트 없음 — sendData 호출 불가. ' +
      '봇 채팅으로 가서 /setdevice 다시 시도하라.</div>';
    return;
  }
  try {
    TG.sendData(payload());
    result.innerHTML = '<div class="ok">✓ 전송됨. 봇 채팅으로 돌아가라.</div>';
    setTimeout(function () { try { TG.close(); } catch (e) {} }, 1000);
  } catch (e) {
    result.innerHTML = '<div class="err">전송 실패: ' + escapeHtml(e.message || String(e)) +
      '<br>아래 [UA 복사] 로 복사 후 봇한테 텍스트로 보내봐라.</div>';
  }
});

document.getElementById('copy').addEventListener('click', function () {
  var text = payload();
  var result = document.getElementById('result');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () {
      result.innerHTML = '<div class="ok">✓ 클립보드에 복사됨. 봇 채팅에 그대로 붙여넣어라.</div>';
    }).catch(function (e) {
      result.innerHTML = '<div class="err">복사 실패: ' + escapeHtml(e.message) + '</div>';
    });
  } else {
    result.innerHTML = '<div class="warn">클립보드 API 미지원. UA 박스를 길게 눌러 직접 복사.</div>';
  }
});
</script>
</body>
</html>
